server {
    listen 443 ssl;
    server_name research.hub.tt2.li;

    ssl_certificate /etc/letsencrypt/live/research.hub.tt2.li/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/research.hub.tt2.li/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Gradio
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}

server {
    if ($host = research.hub.tt2.li) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name research.hub.tt2.li;
    return 404;
}
